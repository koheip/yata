[project]
name = "tomoshibi"
version = "0.1.0"
description = "調べる、読む、ブラウザを動かす個人用AIアシスタント"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tomoshibi contributors" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.49",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "openai>=1.60",
    "playwright>=1.49",
    "pydantic-settings>=2.6",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
tomoshibi = "tomoshibi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomoshibi"]

[tool.hatch.build.targets.wheel.sources]
"src/tomoshibi" = "tomoshibi"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
